name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only used to publish the build log of a failed run to the ci-logs branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build, unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug testDebugUnitTest :core:capabilities:test lintDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: droid-explorer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Publish failed build log to ci-logs branch (debug aid)
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          tail -n 400 build.log > failed-build.log || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp failed-build.log "log-${GITHUB_REF_NAME//\//_}.txt"
          git add "log-${GITHUB_REF_NAME//\//_}.txt"
          git commit -m "Build log for ${GITHUB_SHA}"
          git push --force origin ci-logs
