name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only used to publish the build log of a failed run to the ci-logs branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build, unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug testDebugUnitTest :core:capabilities:test lintDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Render component screenshots
        id: shots
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :ui:design:recordRoborazziDebug --console=plain 2>&1 | tee shots.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: droid-explorer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Publish build result to ci-logs branch (debug aid)
        if: always() && github.event_name == 'push' && github.ref_name != 'main'
        shell: bash
        run: |
          name="result-${GITHUB_REF_NAME//\//_}.txt"
          {
            echo "status=${{ job.status }}"
            echo "sha=${GITHUB_SHA}"
            echo "----- last 400 lines of build log -----"
            tail -n 400 build.log 2>/dev/null || true
            echo "----- screenshots step: ${{ steps.shots.outcome }} -----"
            tail -n 60 shots.log 2>/dev/null || true
          } > "$name"
          mkdir -p /tmp/shots
          cp ui/design/build/outputs/roborazzi/*.png /tmp/shots/ 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . > /dev/null 2>&1 || true
          git add -f "$name"
          if ls /tmp/shots/*.png > /dev/null 2>&1; then
            mkdir -p "shots-${GITHUB_REF_NAME//\//_}"
            cp /tmp/shots/*.png "shots-${GITHUB_REF_NAME//\//_}/"
            git add -f "shots-${GITHUB_REF_NAME//\//_}"
          fi
          git commit -m "Build result for ${GITHUB_SHA}"
          git push --force origin ci-logs
